<!-- Template, not a page: src/build.py fills it in and removes these three lines. -->
<meta name="robots" content="noindex, nofollow">
<!-- /template -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="canonical" href="{{url}}">
{{alternates}}
<meta name="theme-color" content="#f3f0fa">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="/img/icon-96.png">
<link rel="icon" type="image/png" sizes="64x64" href="/img/icon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KasseiGo">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="https://kasseigo.com/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{{site.og_locale}}">
<meta property="og:locale:alternate" content="{{site.og_locale_alternate}}">
<meta name="twitter:card" content="summary_large_image">
<script>
// The app opens /privacy.html?lang=fr: go to the page in that language, keeping the other parameters.
(function(){var q=new URLSearchParams(location.search),p={{lang_paths}}[q.get('lang')];if(!p||p===location.pathname)return;
q.delete('lang');var s=q.toString();location.replace(p+(s?'?'+s:'')+location.hash)})();
</script>
