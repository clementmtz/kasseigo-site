<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feedback · KasseiGo</title>
<meta name="description" content="Report a bug, suggest an idea or point out wrong data in KasseiGo. No account needed.">
<link rel="canonical" href="https://kasseigo.com/feedback.html">
<link rel="icon" type="image/png" sizes="64x64" href="/img/icon-64.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:title" content="Feedback · KasseiGo">
<meta property="og:image" content="https://kasseigo.com/img/og.jpg">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
:root{--bg:#f3f0fa;--card:#fff;--ink:#1d1830;--mut:#6c6584;--line:#e6e1f2;--p:#bba6f4;--pt:#efe9fe;--pd:#6a4bc4;--ok:#1f7048;--bad:#c23a3a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1628;--card:#241e37;--ink:#f2eefc;--mut:#a8a0c3;--line:#372f51;--p:#c4b2f8;--pt:#30274f;--pd:#c4b2f8;--ok:#63c896;--bad:#ef7a7a;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--pd)}
:focus-visible{outline:3px solid var(--pd);outline-offset:3px;border-radius:8px}
.wrap{width:min(680px,100% - 32px);margin-inline:auto}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none;color:var(--ink)}
.brand img{width:36px;height:36px}
.langs{display:flex;gap:2px;padding:3px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
.langs button{min-width:40px;min-height:36px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:700;font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--pt);color:var(--ink)}
main{padding:8px 0 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,40px)}
h1{font-size:clamp(30px,5vw,40px);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}
.lead{color:var(--mut);margin:0 0 28px}
fieldset{border:0;margin:0 0 22px;padding:0}
legend,label.t{display:block;font-weight:700;margin:0 0 10px;padding:0}
.opt{font-weight:500;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:16px;background:var(--bg);border:2px solid transparent;font-weight:650;font-size:15px;cursor:pointer}
.chips input:checked+span{background:var(--pt);border-color:var(--pd)}
.chips input:focus-visible+span{outline:3px solid var(--pd);outline-offset:2px}
textarea,input[type=email]{width:100%;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);font-weight:500;font-size:17px;line-height:1.5;font-family:inherit;padding:14px 16px}
textarea{min-height:160px;resize:vertical}
textarea:focus,input[type=email]:focus{outline:none;border-color:var(--pd)}
.hint{color:var(--mut);font-size:14px;margin:6px 4px 0}
.field{margin:0 0 22px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.check{margin:0 0 18px;min-height:65px}
button.send{width:100%;min-height:64px;border:0;border-radius:20px;background:var(--p);color:#1d1830;font-weight:700;font-size:18px;line-height:1;font-family:inherit;cursor:pointer}
button.send[disabled]{opacity:.6;cursor:default}
.msg{display:none;margin:16px 0 0;padding:14px 16px;border-radius:16px;font-weight:600}
.msg.err{display:block;background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad)}
.done{text-align:center;padding:24px 0}
.done b{display:block;font-size:26px;margin-bottom:8px}
.done p{color:var(--mut);margin:0 0 24px}
.done a{display:inline-flex;align-items:center;min-height:56px;padding:0 24px;border-radius:18px;background:var(--p);color:#1d1830;font-weight:700;text-decoration:none}
.note{color:var(--mut);font-size:14px;margin:18px 4px 0}
.ctx{color:var(--mut);font-size:14px;margin:0 4px 18px}
footer{padding:0 0 48px;color:var(--mut);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px}
footer a{color:var(--mut)}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/"><img src="/img/icon-192.png" alt="" width="36" height="36">KasseiGo</a>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-set="en">EN</button><button type="button" data-set="fr">FR</button><button type="button" data-set="nl">NL</button>
  </div>
</div></header>

<main class="wrap">
  <div class="card">
    <div id="form-view">
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <form id="f" novalidate>
        <fieldset>
          <legend data-t="type"></legend>
          <div class="chips">
            <label><input type="radio" name="type" value="bug" checked><span data-t="bug"></span></label>
            <label><input type="radio" name="type" value="idea"><span data-t="idea"></span></label>
            <label><input type="radio" name="type" value="data"><span data-t="data"></span></label>
            <label><input type="radio" name="type" value="other"><span data-t="other"></span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend><span data-t="city"></span> <span class="opt" data-t="optional"></span></legend>
          <div class="chips">
            <label><input type="radio" name="city" value="brussels"><span data-t="brussels"></span></label>
            <label><input type="radio" name="city" value="paris"><span data-t="paris"></span></label>
            <label><input type="radio" name="city" value="" checked><span data-t="nocity"></span></label>
          </div>
        </fieldset>
        <div class="field">
          <label class="t" for="message" data-t="message"></label>
          <textarea id="message" name="message" maxlength="5000" required></textarea>
          <p class="hint" data-t="messageHint"></p>
        </div>
        <div class="field">
          <label class="t" for="email"><span data-t="email"></span> <span class="opt" data-t="optional"></span></label>
          <input type="email" id="email" name="email" maxlength="200" autocomplete="email">
          <p class="hint" data-t="emailHint"></p>
        </div>
        <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <p class="ctx" id="ctx" hidden></p>
        <div class="check" id="check"></div>
        <button class="send" type="submit" data-t="send"></button>
        <p class="msg" id="err" role="alert"></p>
        <p class="note"><span data-t="privacy"></span> <a href="/privacy.html" data-t="privacyLink"></a>.</p>
      </form>
    </div>
    <div id="done-view" class="done" hidden>
      <b data-t="thanks"></b>
      <p data-t="thanksText"></p>
      <a href="/" data-t="home"></a>
    </div>
  </div>
</main>

<footer><div class="wrap">
  <a href="/">kasseigo.com</a>
  <a href="/terms.html" data-t="terms"></a>
  <a href="/privacy.html" data-t="privacyLink"></a>
  <a href="mailto:contact@kasseigo.com">contact@kasseigo.com</a>
</div></footer>

<script>
// Where messages go (backend/feedback in the main repository) and the anti-robot check of the form.
const ENDPOINT = 'https://kasseigo-feedback.kasseigo.workers.dev';
const SITEKEY = '0x4AAAAAAFlVCz4v9DZM8wDq';

const T = {
  en: {
    h1: 'Send feedback', lead: 'A bug, an idea, a street or a parking spot that is wrong on the map: tell us. No account needed.',
    type: 'What is it about?', bug: 'Something does not work', idea: 'An idea', data: 'Wrong data on the map', other: 'Something else',
    city: 'City', optional: '(optional)', brussels: 'Brussels', paris: 'Paris', nocity: 'Not about a city',
    message: 'Your message', messageHint: 'What happened, where, and what you expected. For wrong data, give the street or the place.',
    email: 'Your email', emailHint: 'Only if you want an answer. It is never shared.',
    send: 'Send', sending: 'Sending…', privacy: 'Your message is stored privately to improve KasseiGo, see the', privacyLink: 'privacy policy',
    ctx: 'Sent with: app {app}, {os}.',
    errShort: 'Please write a few words (at least 10 characters).', errEmail: 'This email address does not look right.',
    errCheck: 'The anti-robot check did not pass. Please try again.', errSend: 'The message could not be sent. Please try again, or write to contact@kasseigo.com.',
    thanks: 'Thank you!', thanksText: 'Your message has been received. Every message is read.', home: 'Back to KasseiGo', terms: 'Terms of use', title: 'Feedback · KasseiGo',
  },
  fr: {
    h1: 'Envoyer un retour', lead: 'Un bug, une idée, une rue ou une place de stationnement fausse sur la carte : dites-le-nous. Aucun compte nécessaire.',
    type: 'De quoi s’agit-il ?', bug: 'Quelque chose ne marche pas', idea: 'Une idée', data: 'Donnée fausse sur la carte', other: 'Autre chose',
    city: 'Ville', optional: '(facultatif)', brussels: 'Bruxelles', paris: 'Paris', nocity: 'Pas une ville en particulier',
    message: 'Votre message', messageHint: 'Ce qui s’est passé, où, et ce que vous attendiez. Pour une donnée fausse, indiquez la rue ou le lieu.',
    email: 'Votre e-mail', emailHint: 'Seulement si vous voulez une réponse. Il n’est jamais partagé.',
    send: 'Envoyer', sending: 'Envoi…', privacy: 'Votre message est conservé de façon privée pour améliorer KasseiGo, voir la', privacyLink: 'politique de confidentialité',
    ctx: 'Envoyé avec : appli {app}, {os}.',
    errShort: 'Écrivez quelques mots (au moins 10 caractères).', errEmail: 'Cette adresse e-mail ne semble pas correcte.',
    errCheck: 'La vérification anti-robot a échoué. Réessayez.', errSend: 'Le message n’a pas pu être envoyé. Réessayez, ou écrivez à contact@kasseigo.com.',
    thanks: 'Merci !', thanksText: 'Votre message a bien été reçu. Chaque message est lu.', home: 'Retour à KasseiGo', terms: 'Conditions d’utilisation', title: 'Retours · KasseiGo',
  },
  nl: {
    h1: 'Feedback sturen', lead: 'Een bug, een idee, een straat of parkeerplek die niet klopt op de kaart: laat het ons weten. Geen account nodig.',
    type: 'Waarover gaat het?', bug: 'Iets werkt niet', idea: 'Een idee', data: 'Foute gegevens op de kaart', other: 'Iets anders',
    city: 'Stad', optional: '(optioneel)', brussels: 'Brussel', paris: 'Parijs', nocity: 'Geen specifieke stad',
    message: 'Je bericht', messageHint: 'Wat er gebeurde, waar, en wat je verwachtte. Bij foute gegevens: geef de straat of de plek.',
    email: 'Je e-mail', emailHint: 'Alleen als je een antwoord wilt. Het wordt nooit gedeeld.',
    send: 'Versturen', sending: 'Versturen…', privacy: 'Je bericht wordt privé bewaard om KasseiGo te verbeteren, zie het', privacyLink: 'privacybeleid',
    ctx: 'Verstuurd met: app {app}, {os}.',
    errShort: 'Schrijf een paar woorden (minstens 10 tekens).', errEmail: 'Dit e-mailadres lijkt niet te kloppen.',
    errCheck: 'De controle tegen robots is mislukt. Probeer opnieuw.', errSend: 'Het bericht kon niet worden verstuurd. Probeer opnieuw, of schrijf naar contact@kasseigo.com.',
    thanks: 'Bedankt!', thanksText: 'Je bericht is goed ontvangen. Elk bericht wordt gelezen.', home: 'Terug naar KasseiGo', terms: 'Gebruiksvoorwaarden', title: 'Feedback · KasseiGo',
  },
};

// From the app: ?lang=en&app=1.0.0 (2)&os=ios Version 18.1. Otherwise the browser language.
const q = new URLSearchParams(location.search);
const ctx = { app: (q.get('app') || '').slice(0, 60), os: (q.get('os') || '').slice(0, 80) };
let lang = q.get('lang');
if (!T[lang]) { try { lang = localStorage.getItem('kg-lang'); } catch (e) {} }
if (!T[lang]) lang = (navigator.language || 'en').slice(0, 2);
if (!T[lang]) lang = 'en';

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.title = T[l].title;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[l][e.dataset.t]; });
  document.querySelectorAll('[data-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.set === l));
  const c = document.getElementById('ctx');
  c.hidden = !ctx.app;
  if (ctx.app) c.textContent = T[l].ctx.replace('{app}', ctx.app).replace('{os}', ctx.os || '?');
  try { localStorage.setItem('kg-lang', l); } catch (e) {}
}
document.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.set)));
setLang(lang);

let token = '', widget = null;
function renderCheck() {
  if (!window.turnstile || widget !== null) return;
  widget = turnstile.render('#check', { sitekey: SITEKEY, language: lang, callback: t => { token = t; }, 'expired-callback': () => { token = ''; } });
}
window.addEventListener('load', renderCheck);

const form = document.getElementById('f'), err = document.getElementById('err'), send = form.querySelector('.send');
function fail(key) { err.textContent = T[lang][key]; err.className = 'msg err'; }
form.addEventListener('submit', async e => {
  e.preventDefault();
  err.className = 'msg';
  const d = new FormData(form);
  const message = (d.get('message') || '').trim(), email = (d.get('email') || '').trim();
  if (message.length < 10) return fail('errShort');
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('errEmail');
  renderCheck();
  if (!token) return fail('errCheck');
  send.disabled = true; send.textContent = T[lang].sending;
  try {
    const r = await fetch(ENDPOINT, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: d.get('type'), city: d.get('city'), message, email, website: d.get('website'), lang, app: ctx.app, os: ctx.os, turnstile: token }),
    });
    if (!r.ok) throw r.status;
    document.getElementById('form-view').hidden = true;
    document.getElementById('done-view').hidden = false;
    window.scrollTo(0, 0);
  } catch (s) {
    fail(s === 403 ? 'errCheck' : 'errSend');
    if (window.turnstile && widget !== null) { turnstile.reset(widget); token = ''; }
  } finally {
    send.disabled = false; send.textContent = T[lang].send;
  }
});
</script>
</body>
</html>
