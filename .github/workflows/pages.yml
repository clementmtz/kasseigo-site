# kasseigo.com: on every push, the pages are generated from their templates and dictionaries (src/),
# then the site is published by GitHub Pages. Nothing generated is committed.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Actions pinned to a commit: a moved tag must not change what publishes the site.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Generate the pages in every language, and the sitemap
        run: python3 src/build.py
      - name: Assemble the published files (without the sources)
        run: |
          mkdir _site
          rsync -a --exclude '.*' --exclude '_site' --exclude 'src' --exclude 'README.md' --exclude 'CLAUDE.md' ./ _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
