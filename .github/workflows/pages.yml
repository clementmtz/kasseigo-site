# kasseigo.com: on every push, the pages are generated from their templates and dictionaries (src/),
# then the site is published by GitHub Pages. Nothing generated is committed.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the pages in every language, and the sitemap
        run: python3 src/build.py
      - name: Assemble the published files (without the sources)
        run: |
          mkdir _site
          rsync -a --exclude '.*' --exclude '_site' --exclude 'src' --exclude 'README.md' --exclude 'CLAUDE.md' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
